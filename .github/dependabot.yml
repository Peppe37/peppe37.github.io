version: 2
updates:
  # Keeps the actions used by the workflows up to date. They are grouped into one pull request
  # on purpose: the Pages actions have to be updated together, and CI tests the whole set at once.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
