name: CI

# Checks the site. Runs on every pull request, and the deploy workflow reuses it so that nothing is published unchecked.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install poppler (reads the text of the CV PDFs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: JavaScript syntax
        run: for f in site/js/*.js; do node --check "$f"; done

      - name: HTML
        run: npx --yes html-validate@9 site/index.html site/404.html

      - name: Build the CV PDFs
        run: python3 scripts/build_cv.py

      - name: Site checks (translations, links, privacy, sizes, CV)
        run: python3 scripts/check_site.py --cv

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Performance, accessibility, best practices and SEO
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
