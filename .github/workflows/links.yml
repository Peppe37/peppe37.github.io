name: Links

# Once a week, checks that every external link on the page (the projects, the live sites) still answers.
# It is separate from CI because a site that is down for an hour should not block a deploy.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check the links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 20
            --exclude 'linkedin\.com' --exclude 'localhost'
            --accept '200..=299,403,429'
            site/index.html
          fail: false
      - name: Open an issue if something is broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links on the portfolio
          content-filepath: ./lychee/out.md
          labels: maintenance
